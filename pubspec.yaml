name: shabelle_system
description: Shabelle Primary School management and bus tracking system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.3.10

  # Navigation
  go_router: ^15.1.3

  # Maps & location
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2

  # UI / utilities
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_typeahead: ^5.2.0
  syncfusion_flutter_charts: ^29.0.10
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  file_picker: ^11.0.3
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
